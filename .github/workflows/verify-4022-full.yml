name: Verify Seaborn 4022 full pytest suite
on:
  push:
    branches:
      - verify/4022-full-suite-20261021
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MPLBACKEND: Agg
      PYDEVD_DISABLE_FILE_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install seaborn and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[stats]" pytest pytest-xdist pytest-cov
      - name: Run all seaborn tests
        run: python -m pytest -q tests --disable-warnings --maxfail=1
