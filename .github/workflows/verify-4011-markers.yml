name: Verify Seaborn 4011 lineplot marker docs
on:
  push:
    branches:
      - verify/4011-lineplot-markers-20261021
permissions:
  contents: read
jobs:
  relational:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install seaborn and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[stats]" pytest ruff
      - name: Run relational plotting regressions
        run: python -m pytest -q tests/test_relational.py --disable-warnings --maxfail=1
      - name: Verify docstring instructions and lint
        run: |
          python - <<'PY'
          from seaborn import lineplot, relplot
          assert 'markers=True' in lineplot.__doc__
          assert 'marker="o"' in lineplot.__doc__
          assert 'markers=True' in relplot.__doc__
          assert 'marker="o"' in relplot.__doc__
          PY
          python -m ruff check seaborn/relational.py
